<div class="krov-ribbon" id="krov-ribbon" hidden>
  <a class="krov-ribbon-msg" href="{{ '/' | relative_url }}#name">
    <span class="krov-ribbon-flag" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="krov-ribbon-text"><strong>Krov</strong> is Croatian for &ldquo;roof.&rdquo; <span class="krov-ribbon-cta">Read the story &rarr;</span></span>
  </a>
  <button type="button" class="krov-ribbon-close" id="krov-ribbon-close" aria-label="Dismiss">&times;</button>
</div>

<header class="global-floating-header" role="banner">
  <nav class="global-floating-nav" aria-label="Main navigation">
    <a class="global-brand" rel="author" href="{{ "/" | relative_url }}">
      <img src="{{ site.logo | relative_url }}" alt="Krov app icon" width="40" height="40">
      <span>{{ site.title | escape }}</span>
    </a>

    <input type="checkbox" id="nav-trigger" class="global-nav-trigger" />

    <label for="nav-trigger" class="global-menu-icon" aria-label="Open navigation menu">
      <span></span>
      <span></span>
      <span></span>
    </label>

    <div class="global-nav-links">
      <a href="{{ "/" | relative_url }}">Home</a>
      <a href="{{ '/' | relative_url }}#name">The Name</a>
      <a href="{{ "/privacy/" | relative_url }}">Privacy</a>
      <a href="{{ "/support/" | relative_url }}">Support</a>
      <a href="#" data-feedback>Send Feedback</a>
      <a class="global-nav-cta" href="https://apps.apple.com/au/app/upkeep/id6777450786">Download</a>
    </div>
  </nav>
</header>

<script>
  // Feedback links compose an email without the address appearing anywhere in
  // the page source as a complete string (deters address scrapers).
  (function () {
    var u = ['support'].join('');
    var d = ['krov', 'app'].join('.');
    document.addEventListener('click', function (e) {
      var link = e.target.closest('[data-feedback]');
      if (!link) return;
      e.preventDefault();
      window.location.href = 'mailto:' + u + '@' + d +
        '?subject=' + encodeURIComponent('Krov feedback');
    });
  })();

  // Condense the floating nav once the page scrolls past the top.
  (function () {
    var header = document.querySelector('.global-floating-header');
    if (!header) return;
    var onScroll = function () {
      header.classList.toggle('scrolled', window.scrollY > 8);
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
  })();

  // Show the "name" ribbon until the visitor dismisses it (remembered locally).
  (function () {
    var ribbon = document.getElementById('krov-ribbon');
    if (!ribbon) return;
    var KEY = 'krovRibbonDismissed';
    try { if (localStorage.getItem(KEY)) return; } catch (e) {}
    ribbon.hidden = false;
    document.body.classList.add('has-ribbon');
    var close = document.getElementById('krov-ribbon-close');
    if (close) {
      close.addEventListener('click', function (e) {
        e.preventDefault();
        ribbon.hidden = true;
        document.body.classList.remove('has-ribbon');
        try { localStorage.setItem(KEY, '1'); } catch (e2) {}
      });
    }
  })();
</script>
