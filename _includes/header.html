<header class="global-floating-header" role="banner">
  <nav class="global-floating-nav" aria-label="Main navigation">
    <a class="global-brand" rel="author" href="{{ "/" | relative_url }}">
      <img src="{{ site.logo | relative_url }}" alt="Krov app icon" width="40" height="40">
      <span>{{ site.title | escape }}</span>
    </a>

    <input type="checkbox" id="nav-trigger" class="global-nav-trigger" />

    <label for="nav-trigger" class="global-menu-icon" aria-label="Open navigation menu">
      <span></span>
      <span></span>
      <span></span>
    </label>

    <div class="global-nav-links">
      <a href="{{ "/" | relative_url }}">Home</a>
      <a href="{{ "/privacy/" | relative_url }}">Privacy</a>
      <a href="{{ "/support/" | relative_url }}">Support</a>
      <a href="#" data-feedback>Send Feedback</a>
      <a class="global-nav-cta" href="https://apps.apple.com/au/app/upkeep/id6777450786">Download</a>
    </div>
  </nav>
</header>

<script>
  // Feedback links compose an email without the address appearing anywhere in
  // the page source as a complete string (deters address scrapers).
  (function () {
    var u = ['support'].join('');
    var d = ['krov', 'app'].join('.');
    document.addEventListener('click', function (e) {
      var link = e.target.closest('[data-feedback]');
      if (!link) return;
      e.preventDefault();
      window.location.href = 'mailto:' + u + '@' + d +
        '?subject=' + encodeURIComponent('Krov feedback');
    });
  })();

  // Condense the floating nav once the page scrolls past the top.
  (function () {
    var header = document.querySelector('.global-floating-header');
    if (!header) return;
    var onScroll = function () {
      header.classList.toggle('scrolled', window.scrollY > 8);
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
  })();
</script>
